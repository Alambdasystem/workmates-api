services:
  - type: web
    name: workmates-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m waitress --call --listen=0.0.0.0:$PORT --threads=8 --max-request-body-size=8388608 server:create_app
    healthCheckPath: /healthz
    disk:
      name: workmates-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/workmates.db
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_NAME
        value: James Hill
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: TRANSCRIPTION_MODEL
        value: gpt-transcribe
